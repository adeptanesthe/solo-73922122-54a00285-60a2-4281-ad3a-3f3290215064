services:
  api:
    build: .
    image: ocr-proofreading-api:latest
    container_name: ocr-proofreading-api
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置（容器内路径，挂载到命名卷持久化）
      PROOF_DB_PATH: /data/proofreading.db
    volumes:
      - proof-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  proof-data:
